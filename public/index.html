<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prisma — IA local, modelos grátis, memória</title>
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ESQUERDA ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="logo-mark.png" alt="" class="brand-logo" />
      <div class="brand-text">
        <h1>Prisma</h1>
        <span class="brand-sub">Inteligência Positivo</span>
      </div>
      <span class="dot dot-green" id="brand-dot" title="status dos provedores"></span>
    </div>

    <button id="btn-new-chat" class="btn-new">Nova conversa</button>

    <!-- O roteamento agora vive em cada conversa (seletor na barra do chat) -->

    <!-- histórico -->
    <div class="panel panel-grow">
      <div class="panel-title">Conversas</div>
      <div id="conversation-list" class="conversation-list"></div>
    </div>

    <!-- ações -->
    <div class="sidebar-actions">
      <button class="btn-ghost" id="btn-agents">🧩 Agentes</button>
      <button class="btn-ghost" id="btn-roi">📈 Horas economizadas</button>
      <button class="btn-ghost" id="btn-memory">🧠 Memória</button>
      <button class="btn-ghost" id="btn-skills">🛠 Skills</button>
      <button class="btn-ghost" id="btn-models">🔁 Modelos grátis</button>
    </div>
  </aside>

  <!-- redimensionador sidebar | chat -->
  <div class="resizer" id="resizer-left" title="Arraste para redimensionar"></div>

  <!-- ============ CENTRO — CHAT ============ -->
  <main class="chat">
    <header class="chat-statusbar">
      <div class="status-left">
        <button type="button" id="model-picker-btn" class="model-picker-btn" title="Escolher modelo desta conversa">
          <span class="dot dot-green" id="status-dot"></span>
          <span id="status-active-label">Automático</span>
          <span class="chev">⌄</span>
        </button>
      </div>
      <div class="status-right" id="status-routing"></div>

      <!-- janelinha de escolha de modelo (por conversa) -->
      <div class="model-pop hidden" id="model-pop">
        <div class="model-pop-head">
          <span>Modelo desta conversa</span>
          <button type="button" class="btn-icon" id="model-pop-close">✕</button>
        </div>
        <div class="model-pop-body" id="model-pop-body"></div>
      </div>
    </header>

    <div class="project-topbar" id="project-topbar">
      <div class="topbar-left">
        <select id="agent-select" title="Agente ativo — atua com a persona, conhecimento e conectores dele"></select>
        <select id="project-select"></select>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost-top" id="btn-connect-folder">📁 Conectar pasta</button>
        <button class="btn-ghost-top" id="btn-clone">⬇ Clonar repo</button>
        <button class="btn-ghost-top hidden" id="btn-analyze">🔍 Analisar</button>
        <button class="btn-ghost-top hidden" id="btn-index">📚 RAG</button>
        <button class="btn-ghost-top hidden" id="btn-git">🔱 Git</button>
        <label class="apply-toggle hidden" id="apply-toggle-wrap" style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:4px;margin-left:6px;"><input type="checkbox" id="auto-apply" checked> auto-aplicar</label>
      </div>
    </div>
    <div id="project-info" class="mode-info hidden"></div>

    <div class="chat-window" id="chat-window">
      <div class="chat-empty" id="chat-empty">
        <img src="logo-mark.png" alt="" class="empty-logo-img" />
        <h2>Seu cowork local está pronto</h2>
        <p>Modelos 100% grátis, memória persistente em disco, skills e artefatos. Modo autônomo escolhe o modelo por você.</p>
      </div>
    </div>

    <form id="chat-form" class="chat-input-bar">
      <input type="file" id="file-input" accept="image/*,.txt,.md,.js,.ts,.py,.json,.yaml,.yml,.html,.css,.csv,.xml,.sh,.bash,.sql,.jsx,.tsx,.java,.c,.cpp,.h,.rs,.go,.rb,.php" hidden />
      <button type="button" id="btn-attach" class="btn-attach" title="Anexar arquivo ou imagem">+</button>
      <div class="chat-input-wrap">
        <div id="reply-quote" class="reply-quote hidden"></div>
        <div id="file-preview" class="file-preview hidden"></div>
        <textarea id="chat-input" placeholder="Fale com seu cowork…  (Enter envia · Shift+Enter quebra linha)" rows="1"></textarea>
      </div>
      <button type="submit" id="btn-send">Enviar</button>
    </form>
  </main>

  <!-- redimensionador chat | artefatos -->
  <div class="resizer" id="resizer-right" title="Arraste para redimensionar"></div>

  <!-- ============ DIREITA — ARTEFATOS ============ -->
  <aside class="artifacts" id="artifacts-panel">
    <header class="artifacts-head">
      <span>Artefatos</span>
      <button class="btn-icon" id="btn-close-artifacts" title="Fechar">✕</button>
    </header>
    <div class="artifacts-tabs" id="artifacts-tabs"></div>
    <div class="artifacts-body" id="artifacts-body"></div>
  </aside>

</div>

<!-- ============ MODAL GENÉRICO ============ -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal">
    <header class="modal-head">
      <h3 id="modal-title">Título</h3>
      <button class="btn-icon" id="modal-close">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

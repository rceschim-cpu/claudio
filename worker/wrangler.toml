name = "claudio"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# prompts/claudio.md entra como módulo de texto, importado no runtime do
# Worker. É o que permite iterar no prompt sem tocar em código.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"
GROQ_MODEL_FALLBACK = "openai/gpt-oss-120b"
GROQ_BASE_URL = "https://api.groq.com/openai/v1"

# Orçamento — abaixo do teto do free tier da Groq (30 rpm / 1.000 dia / 12k tpm).
CLAUDIO_MAX_TOKENS = "220"
CLAUDIO_DAILY_BUDGET = "850"
CLAUDIO_RPM_BUDGET = "24"
CLAUDIO_TPM_BUDGET = "10000"
CLAUDIO_IP_PER_MIN = "4"
CLAUDIO_IP_PER_DAY = "40"
CLAUDIO_SESSION_PER_DAY = "60"
CLAUDIO_HISTORY_TURNS = "6"

CLAUDIO_KILL_SWITCH = "off"
ALLOWED_ORIGINS = "https://rceschim-cpu.github.io,http://localhost:8787,http://127.0.0.1:8787"

# GROQ_API_KEY NÃO fica aqui. É secret:
#   npx wrangler secret put GROQ_API_KEY

# O site estático mora no GitHub Pages, mas o Worker também o serve. Assim
# `npm run dev` sobe front e API juntos num comando só, e a URL do Worker
# funciona como espelho se o Pages der problema.
[assets]
directory = "../web"
run_worker_first = ["/api/*", "/health"]

# Contabilidade global (rate limit + cota + tokens) num único objeto.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[observability]
enabled = true

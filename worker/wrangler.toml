name = "claudio"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# prompts/claudio.md entra como módulo de texto, importado no runtime do
# Worker. É o que permite iterar no prompt sem tocar em código.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[vars]
# Corrente de provedores e modelos, em ordem de preferência. Formato
# provedor:modelo. A ordem saiu de bench/ranking.js, e ALTERNA CONTA de
# propósito: o teto do free tier é por conta, então enfileirar cinco modelos
# da Groq esgota a Groq inteira e para tudo. Alternar estica o dia.
#
# Elo sem chave é pulado em silêncio — dá para deixar xai aí no fim e ele só
# entra se alguém puser XAI_API_KEY (que é paga).
CLAUDIO_CORRENTE = "groq:llama-3.3-70b-versatile,mistral:mistral-large-latest,groq:openai/gpt-oss-120b,cohere:command-a-03-2025,mistral:mistral-small-latest,groq:openai/gpt-oss-20b,gemini:gemini-2.5-flash,groq:qwen/qwen3.6-27b,mistral:mistral-medium-2508,cerebras:gpt-oss-120b,xai:grok-4.20-0309-non-reasoning"
GROQ_BASE_URL = "https://api.groq.com/openai/v1"

# Orçamento — abaixo do teto do free tier da Groq (30 rpm / 1.000 dia / 12k tpm).
CLAUDIO_MAX_TOKENS = "220"
# O gargalo REAL do free tier não é requisição por dia (1.000), é TOKEN por
# dia (~100k por modelo). Com ~1.400 tokens de prompt por chamada, cada modelo
# aguenta ~70 mensagens/dia. Com os 5 da corrente, ~350. O 850 daqui era
# ficção: o produto morria de 429 muito antes de chegar perto.
CLAUDIO_DAILY_BUDGET = "320"
CLAUDIO_RPM_BUDGET = "24"
CLAUDIO_TPM_BUDGET = "10000"
CLAUDIO_IP_PER_MIN = "4"
CLAUDIO_IP_PER_DAY = "40"
CLAUDIO_SESSION_PER_DAY = "60"
CLAUDIO_HISTORY_TURNS = "6"

CLAUDIO_KILL_SWITCH = "off"
ALLOWED_ORIGINS = "https://rceschim-cpu.github.io,http://localhost:8787,http://127.0.0.1:8787"

# GROQ_API_KEY NÃO fica aqui. É secret:
#   npx wrangler secret put GROQ_API_KEY

# O site estático mora no GitHub Pages, mas o Worker também o serve. Assim
# `npm run dev` sobe front e API juntos num comando só, e a URL do Worker
# funciona como espelho se o Pages der problema.
[assets]
directory = "../web"
run_worker_first = ["/api/*", "/health"]

# Contabilidade global (rate limit + cota + tokens) num único objeto.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[observability]
enabled = true
